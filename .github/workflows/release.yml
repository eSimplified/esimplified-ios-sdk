name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version and decide whether it is new
        id: version
        run: |
          version=$(sed -n 's/.*public static let version = "\(.*\)".*/\1/p' Sources/EsimplifiedSDK/EsimplifiedSDK.swift)

          if [ -z "$version" ]; then
            echo "::error file=Sources/EsimplifiedSDK/EsimplifiedSDK.swift::Could not read EsimplifiedSDKVersion.version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is already released. Nothing to do."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$version has no tag yet. Releasing it."
          fi

          previous=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: Write the release notes
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            .github/scripts/release-notes.sh "${{ needs.check.outputs.version }}" "${{ needs.check.outputs.previous }}"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.check.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
